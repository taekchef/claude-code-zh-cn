name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check PR body auto-close keywords
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-autoclose-keywords.js --body-env PR_BODY

      - name: Run PR preflight
        if: github.event_name == 'pull_request'
        run: bash scripts/preflight.sh --base "${{ github.event.pull_request.base.sha }}" --skip-release-state

      - name: Run main preflight
        if: github.event_name == 'push'
        run: bash scripts/preflight.sh --skip-payload-source --skip-release-state

  windows-install-smoke:
    name: windows-install-smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: PowerShell install smoke
        shell: powershell
        run: node --test tests/install-smoke.test.js tests/hook-entrypoints.test.js

  linux-native-compat:
    name: linux-native-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install native verification dependency
        run: npm install --no-save node-lief@1.3.2

      - name: Verify Linux native baseline
        run: node scripts/verify-upstream-compat.js --skip-latest --native-linux-x64 --fail-on-skip --json --verify-install

  windows-native-compat:
    name: windows-native-compat (${{ matrix.shard }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install native verification dependency
        run: npm install --no-save node-lief@1.3.2

      - name: Verify Windows native support window
        shell: powershell
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $Versions = node -p 'require("./scripts/upstream-compat.config.json").support.windowsNativeExperimental.representatives.filter((_, i) => i % 4 === Number(process.env.SHARD)).join(",")'
          node scripts/verify-upstream-compat.js --skip-latest --native-windows-x64 --json --baseline "$Versions" --verify-install --fail-on-skip

  macos-bytecode-compat:
    name: macos-bytecode-compat
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install native verification dependency
        run: npm install --no-save node-lief@1.3.2
      - name: Verify published bytecode versions
        run: |
          VERSIONS="$(node -p 'require("./scripts/upstream-compat.config.json").support.macosNativeExperimental.representatives.filter(v => Number(v.split(".")[2]) >= 242).join(",")')"
          test -n "$VERSIONS"
          node scripts/verify-upstream-compat.js --baseline "$VERSIONS" --skip-latest --native-macos-arm64 --fail-on-skip --json --verify-install
